        otaStyle.id = "sfOtaInjectedStyle";
        otaStyle.textContent = cachedOtaCss;

        console.log("[OTA CSS] Estilos atualizados da Nuvem injetados com sucesso!");

    } catch(e) {}

  <div id="tvDiagnosticsBox" style="display:none; position:fixed; top:12px; left:12px; right:12px; background:rgba(229,9,20,0.95); color:#fff; padding:12px 18px; border-radius:8px; z-index:9999999; font-size:16px; font-weight:bold; box-shadow:0 6px 20px rgba(0,0,0,0.8);"></div>
  <div class="app-root">

    <!-- ====================================================================
       STREAMFLIX OTA ZERO-TOUCH AUTO-UPDATE BOOTLOADER (REDE NACIONAL BRASIL)
       Atualiza qualquer Smart TV em qualquer estado do Brasil automaticamente
       via Wi-Fi/Cabo sempre que o projeto for alterado, sem precisar de pen drive!
       ==================================================================== -->
  <script id="sfOtaBootloader">
  (function() {
    var LOCAL_BUILD_TS = 1761338250;
    var OTA_VERSION_URLS = [
      "https://raw.githubusercontent.com/Drapent/streamflix-server/main/version.json",
      "https://cdn.jsdelivr.net/gh/Drapent/streamflix-server@main/version.json",
      "https://cdn.statically.io/gh/Drapent/streamflix-server/main/version.json"
    ];
    var OTA_CODE_MIRRORS = [
      {
        name: "GitHub Direct",
        js: "https://raw.githubusercontent.com/Drapent/streamflix-server/main/static/app.js",
        css: "https://raw.githubusercontent.com/Drapent/streamflix-server/main/static/styles.css"
      },
      {
        name: "jsDelivr Edge (São Paulo/Fortaleza)",
        js: "https://cdn.jsdelivr.net/gh/Drapent/streamflix-server@main/static/app.js",
        css: "https://cdn.jsdelivr.net/gh/Drapent/streamflix-server@main/static/styles.css"
      },
      {
        name: "Statically CDN",
        js: "https://cdn.statically.io/gh/Drapent/streamflix-server/main/static/app.js",
        css: "https://cdn.statically.io/gh/Drapent/streamflix-server/main/static/styles.css"
      }
    ];

    // 1. EXECUÇÃO IMEDIATA (0ms de espera na inicialização da TV)
    var activeCode = null;
    var activeTs = LOCAL_BUILD_TS;
    try {
      var savedTs = parseInt(localStorage.getItem("sf_ota_ts") || "0", 10);
      if (savedTs > LOCAL_BUILD_TS) {
        var savedJs = localStorage.getItem("sf_ota_js");
        if (savedJs && savedJs.length > 50000) {
          activeCode = savedJs;
          activeTs = savedTs;
        }
      }
    } catch(e) {}

    function runBundledApp() {
      var s = document.createElement("script");
      s.src = "app.js?t=" + Date.now();
      document.body.appendChild(s);
    }

    if (activeCode) {
      try {
        var otaScript = document.createElement("script");
        otaScript.type = "text/javascript";
        otaScript.text = activeCode;
        document.body.appendChild(otaScript);
        console.log("[OTA Bootloader Brasil] Rodando versao OTA atualizada (TS: " + activeTs + ")!");
      } catch(err) {
        console.warn("[OTA Bootloader] Falha ao rodar codigo OTA, revertendo com seguranca para versao empacotada:", err);
        try { localStorage.removeItem("sf_ota_js"); } catch(_) {}
        runBundledApp();
      }
    } else {
      runBundledApp();
    }

    // 2. VERIFICAÇÃO AUTOMÁTICA EM SEGUNDO PLANO (CASCATA MULTI-CDN BRASIL)
    var isChecking = false;
    function checkOtaUpdate() {
      if (isChecking) return;
      isChecking = true;
      var vIndex = 0;

      function tryNextVersionUrl() {
        if (vIndex >= OTA_VERSION_URLS.length) {
          isChecking = false;
          return;
        }
        var url = OTA_VERSION_URLS[vIndex++];
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url + "?_=" + Date.now(), true);
        xhr.timeout = 5000;
        xhr.onerror = tryNextVersionUrl;
        xhr.ontimeout = tryNextVersionUrl;
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              try {
                var vData = JSON.parse(xhr.responseText);
                var remoteTs = parseInt(vData.timestamp || "0", 10);
                var currentBestTs = Math.max(LOCAL_BUILD_TS, parseInt(localStorage.getItem("sf_ota_ts") || "0", 10));
                if (remoteTs > currentBestTs) {
                  console.log("[OTA Brasil] Nova versao detectada (" + remoteTs + " > " + currentBestTs + "). Baixando...");
                  downloadOtaUpdate(remoteTs);
                  isChecking = false;
                  return;
                }
              } catch(e) {}
              isChecking = false;
            } else {
              tryNextVersionUrl();
            }
          }
        };
        try { xhr.send(); } catch(e) { tryNextVersionUrl(); }
      }
      tryNextVersionUrl();
    }

    // 3. DOWNLOAD RESILIENTE DO NOVO CÓDIGO COM INTEGRIDADE E RETRY EM CASCATA
    function downloadOtaUpdate(newTs) {
      var mirrorIndex = 0;

      function tryNextMirror() {
        if (mirrorIndex >= OTA_CODE_MIRRORS.length) {
          console.warn("[OTA Brasil] Todos os mirrors falharam no download desta versao.");
          return;
        }
        var mirror = OTA_CODE_MIRRORS[mirrorIndex++];
        var xhrJs = new XMLHttpRequest();
        xhrJs.open("GET", mirror.js + "?_=" + Date.now(), true);
        xhrJs.timeout = 15000;
        xhrJs.onerror = tryNextMirror;
        xhrJs.ontimeout = tryNextMirror;
        xhrJs.onreadystatechange = function() {
          if (xhrJs.readyState === 4) {
            if (xhrJs.status === 200) {
              var newJsCode = xhrJs.responseText;
              // Validacao rigorosa: garante que nao e HTML de erro (404/500) nem arquivo incompleto
              if (newJsCode && newJsCode.length > 50000 && (newJsCode.indexOf("STREAMFLIX") !== -1 || newJsCode.indexOf("function") !== -1)) {
                try {
                  localStorage.setItem("sf_ota_js", newJsCode);
                  localStorage.setItem("sf_ota_ts", String(newTs));

                  // Baixa estilos CSS em paralelo
                  var xhrCss = new XMLHttpRequest();
                  xhrCss.open("GET", mirror.css + "?_=" + Date.now(), true);
                  xhrCss.timeout = 10000;
                  xhrCss.onreadystatechange = function() {
                    if (xhrCss.readyState === 4 && xhrCss.status === 200) {
                      try { localStorage.setItem("sf_ota_css", xhrCss.responseText); } catch(_) {}
                    }
                    scheduleSafeOtaReload();
                  };
                  xhrCss.onerror = function() { scheduleSafeOtaReload(); };
                  xhrCss.send();
                } catch(e) {
                  console.warn("[OTA Brasil] Erro de espaco no armazenamento da TV:", e);
                }
              } else {
                tryNextMirror();
              }
            } else {
              tryNextMirror();
            }
          }
        };
        try { xhrJs.send(); } catch(e) { tryNextMirror(); }
      }
      tryNextMirror();
    }

    // 4. PROTEÇÃO DE REPRODUÇÃO: NUNCA INTERROMPE FILME EM ANDAMENTO
    function scheduleSafeOtaReload() {
      function canSafelyReload() {
        var v = document.getElementById("videoPlayer");
        if (v && !v.paused && v.currentTime > 0) return false;
        var pLayer = document.getElementById("netflixPlayerLayer");
        if (pLayer && pLayer.style.display === "block") return false;
        return true;
      }

      if (canSafelyReload()) {
        showOtaToast();
      } else {
        console.log("[OTA Brasil] Filme/Canal em reproducao. A atualizacao sera aplicada assim que sair do player!");
        var waitPlayer = setInterval(function() {
          if (canSafelyReload()) {
            clearInterval(waitPlayer);
            showOtaToast();
          }
        }, 5000);
      }
    }

    function showOtaToast() {
      var toast = document.getElementById("sfOtaNotification");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "sfOtaNotification";
        toast.style.cssText = "position:fixed;bottom:25px;right:25px;background:#00d2ff;color:#050914;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;padding:14px 24px;border-radius:12px;box-shadow:0 8px 30px rgba(0,210,255,0.5);z-index:99999999;display:flex;align-items:center;gap:10px;animation:fadeIn 0.4s ease;";
        toast.innerHTML = "<span>🚀 STREAMFLIX Atualizado Automaticamente! Reiniciando em 2s...</span>";
        document.body.appendChild(toast);
      }

      setTimeout(function() {
        window.location.reload();
      }, 2000);
    }

    // Inicia verificacao 2s apos a abertura
    setTimeout(checkOtaUpdate, 2000);
    // E verifica periodicamente a cada 35 segundos em qualquer Smart TV no Brasil!
    setInterval(checkOtaUpdate, 35000);
  })();
  </script>
